name: Feature request
description: An idea or improvement
labels: [enhancement]
body:
  - type: textarea
    id: idea
    attributes:
      label: What would you like?
      description: The feature, and what you'd use it for.
    validations:
      required: true
  - type: textarea
    id: extra
    attributes:
      label: Anything else
      description: How BlueStacks or another emulator handles it, screenshots, links.
