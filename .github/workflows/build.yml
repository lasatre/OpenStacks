name: Build

# One workflow, two platforms built in parallel:
#   windows: QEMU 11.1 with the OpenStacks devices (MSYS2 ucrt64), the open renderer
#            (gfxstream, VS 2022 ClangCL), the PySide6 front-end (PyInstaller), image patches
#            and 7-Zip -> OpenStacks-<version>-win64.zip
#   linux:   the same on Ubuntu 22.04 (packaging/build_linux.sh) -> an AppImage
# Tags v* publish both in one (draft) GitHub release once both jobs pass.
# Compilers go through ccache (QEMU on both, gfxstream on Linux); the Windows gfxstream
# build dir is cached by an exact key over renderer/ (MSBuild has no compiler launcher).

on:
  push:
    branches: [master, main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write          # only used by the release job on tags

env:
  QEMU_VERSION: "11.1.0"
  PYTHON_VERSION: "3.12"
  SEVENZIP_URL: https://github.com/ip7z/7zip/releases/download/26.06/7zr.exe
  SEVENZIP_SHA256: e80db2dad715a6c5adabe292d31ed54e11f4e9b99ca349827b50573b175891bc
  CCACHE_MAXSIZE: 2G

jobs:
  windows:
    runs-on: windows-2022
    defaults:
      run:
        shell: pwsh
    env:
      CCACHE_DIR: ${{ github.workspace }}\.ccache
    steps:
      - uses: actions/checkout@v4

      # (each job derives the version itself: the Windows job also runs alone under act)
      - name: Version
        run: |
          if ("${{ github.ref_type }}" -eq "tag") {
            $v = "${{ github.ref_name }}".TrimStart("v")
          } else {
            $base = (Select-String frontend/openstacks/__init__.py -Pattern '__version__ = "([^"]+)"').Matches[0].Groups[1].Value
            $v = "$base-dev.$("${{ github.sha }}".Substring(0, 7))"
          }
          "VERSION=$v" >> $env:GITHUB_ENV
          Write-Host "version $v"

      # (skipped under nektos/act on a Windows host: these installers do not run there;
      #  act uses the machine's Python and C:\msys64 instead)
      - uses: actions/setup-python@v5
        if: ${{ !env.ACT }}
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: MSYS2 (ucrt64 toolchain for QEMU)
        id: msys2
        if: ${{ !env.ACT }}
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            diffutils
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-ccache
            mingw-w64-ucrt-x86_64-ninja
            mingw-w64-ucrt-x86_64-meson
            mingw-w64-ucrt-x86_64-pkgconf
            mingw-w64-ucrt-x86_64-python
            mingw-w64-ucrt-x86_64-glib2
            mingw-w64-ucrt-x86_64-pixman
            mingw-w64-ucrt-x86_64-libslirp
            mingw-w64-ucrt-x86_64-dtc

      - name: Cache QEMU source tarball
        uses: actions/cache@v4
        with:
          path: deps/qemu-${{ env.QEMU_VERSION }}.tar.xz
          key: qemu-src-${{ env.QEMU_VERSION }}

      - name: Cache ccache (QEMU)
        uses: actions/cache@v4
        with:
          path: .ccache
          key: ccache-windows-${{ github.sha }}
          restore-keys: ccache-windows-

      - name: Build QEMU
        env:
          MSYS2_ROOT: ${{ steps.msys2.outputs.msys2-location }}
        run: |
          cmd /c qemu\build.cmd
          if ($LASTEXITCODE -ne 0) { throw "QEMU build failed" }

      - name: QEMU runs without MSYS2 on PATH and has the OpenStacks devices
        shell: cmd
        run: |
          set "PATH=%SystemRoot%\system32;%SystemRoot%"
          build\qemu-system-x86_64.exe -device help > devices.txt 2>&1
          findstr /c:"bstpgaipc" devices.txt || (type devices.txt & exit /b 1)
          findstr /c:"bstvmsg" devices.txt || exit /b 1

      # The open GPU renderer (instance renderer = gfxstream): ost_renderer.dll + the
      # shader translator, installed into build\ so assemble.py ships them with QEMU.
      - name: Cache shader translator (from the Android emulator package, ~455 MB)
        uses: actions/cache@v4
        with:
          path: deps/shadertranslator/windows
          key: shadertranslator-windows-${{ hashFiles('renderer/fetch_shadertranslator.py') }}

      # exact key: a hit means identical renderer sources, so MSBuild's up-to-date check
      # (timestamps) is safe; any change rebuilds from scratch
      - name: Cache gfxstream build
        uses: actions/cache@v4
        with:
          path: |
            deps/gfxstream
            deps/ost-renderer-build
          key: gfxstream-windows-${{ hashFiles('renderer/**') }}

      - name: Build the open renderer (gfxstream, VS 2022 ClangCL)
        run: |
          cmd /c renderer\build_gfxstream.cmd
          if ($LASTEXITCODE -ne 0) { throw "renderer build failed" }
          foreach ($f in "ost_renderer.dll", "libshadertranslator.dll") {
            if (-not (Test-Path "build/$f")) { throw "build/$f missing" }
          }

      - name: Front-end (PyInstaller)
        run: |
          python -m venv .venv-build
          $py = ".venv-build\Scripts\python.exe"
          & $py packaging/set_version.py "$env:VERSION"
          & $py -m pip install --upgrade pip
          & $py -m pip install -r frontend/requirements.txt pyinstaller
          & $py -m PyInstaller --noconfirm --distpath dist --workpath build-pyi packaging/openstacks.spec
          if ($LASTEXITCODE -ne 0) { throw "PyInstaller failed" }

      - name: 7-Zip (7zr.exe, pinned)
        run: |
          New-Item -ItemType Directory -Force deps | Out-Null
          Invoke-WebRequest -Uri $env:SEVENZIP_URL -OutFile deps/7zr.exe
          $h = (Get-FileHash deps/7zr.exe -Algorithm SHA256).Hash.ToLower()
          if ($h -ne $env:SEVENZIP_SHA256) { throw "7zr.exe sha256 $h != $env:SEVENZIP_SHA256" }

      - name: Assemble release
        env:
          MSYS2_ROOT: ${{ steps.msys2.outputs.msys2-location }}     # strip.exe for QEMU
        run: |
          python packaging/assemble.py --version "$env:VERSION" --sevenzip deps/7zr.exe --zip

      - name: Smoke test (frozen app, clean PATH)
        run: |
          $env:PATH = "$env:SystemRoot\system32;$env:SystemRoot"
          $p = Start-Process -FilePath release/OpenStacks/OpenStacks.exe -ArgumentList "--smoke", "$PWD\smoke.txt" -Wait -PassThru
          Get-Content smoke.txt
          if ($p.ExitCode -ne 0) { throw "smoke test failed ($($p.ExitCode))" }
          if (Test-Path release/OpenStacks/data) { Remove-Item -Recurse -Force release/OpenStacks/data }

      # the folder for people (artifacts are zipped on download: a ZIP would arrive as a
      # ZIP inside a ZIP), the ZIP itself for the release job
      - uses: actions/upload-artifact@v4
        with:
          name: OpenStacks-${{ env.VERSION }}-win64
          path: release/OpenStacks/
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: github.ref_type == 'tag'
        with:
          name: release-windows
          path: release/OpenStacks-${{ env.VERSION }}-win64.zip
          if-no-files-found: error
          retention-days: 3

  linux:
    runs-on: ubuntu-22.04
    env:
      CCACHE_DIR: ${{ github.workspace }}/.ccache
    outputs:
      version: ${{ steps.ver.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - name: Version
        id: ver
        run: |
          if [ "${{ github.ref_type }}" = tag ]; then
            v="${{ github.ref_name }}"; v="${v#v}"
          else
            base=$(sed -n 's/^__version__ = "\(.*\)"/\1/p' frontend/openstacks/__init__.py)
            v="$base-dev.${GITHUB_SHA::7}"
          fi
          echo "VERSION=$v" >> "$GITHUB_ENV"
          echo "version=$v" >> "$GITHUB_OUTPUT"
          echo "version $v"

      - name: Build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends \
            build-essential ccache ninja-build pkg-config python3-venv python3-tomli \
            libglib2.0-dev libpixman-1-dev libslirp-dev libfdt-dev zlib1g-dev libpulse-dev \
            clang cmake git libx11-dev libgl1-mesa-dev libegl1-mesa-dev libdrm-dev \
            patchelf file curl xz-utils zsync \
            libxcb-cursor0 libxkbcommon-x11-0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 \
            libxcb-randr0 libxcb-render-util0 libxcb-shape0 libxcb-xinerama0 libxcb-xkb1

      # the front-end needs Python 3.12+ (see packaging/build_linux.sh: PySide6's
      # Signal.emit leaks references to True, fatal before 3.12's immortal objects)
      - uses: actions/setup-python@v5
        id: py
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Cache QEMU source tarball
        uses: actions/cache@v4
        with:
          path: deps/qemu-${{ env.QEMU_VERSION }}.tar.xz
          key: qemu-src-${{ env.QEMU_VERSION }}

      - name: Cache ccache (QEMU + gfxstream)
        uses: actions/cache@v4
        with:
          path: .ccache
          key: ccache-linux-${{ github.sha }}
          restore-keys: ccache-linux-

      - name: Cache shader translator (from the Android emulator package, ~350 MB)
        uses: actions/cache@v4
        with:
          path: deps/shadertranslator/linux
          key: shadertranslator-linux-${{ hashFiles('renderer/fetch_shadertranslator.py') }}

      - name: Cache packaging tools (appimagetool, runtime, 7-Zip; pinned)
        uses: actions/cache@v4
        with:
          path: deps/packaging
          key: packaging-tools-${{ hashFiles('packaging/build_linux.sh') }}

      - name: Build QEMU, the open renderer, the front-end, the AppImage
        run: STAMP_VERSION=1 PYTHON="${{ steps.py.outputs.python-path }}" bash packaging/build_linux.sh "$VERSION"

      # AppImage updaters (AppManager, AppImageUpdate, Gear Lever...) read the embedded
      # update information and fetch the .zsync from the latest release
      - name: Update information and .zsync
        run: |
          f="release/OpenStacks-$VERSION-x86_64.AppImage"
          test -s "$f.zsync" || { echo "$f.zsync missing"; exit 1; }
          info=$(objcopy -O binary --only-section=.upd_info "$f" /dev/stdout | tr -d '\0')
          echo "update information: $info"
          case "$info" in "gh-releases-zsync|"*) ;; *) echo "no update information"; exit 1;; esac

      - name: ccache stats
        run: ccache -s

      - uses: actions/upload-artifact@v4
        with:
          name: OpenStacks-${{ env.VERSION }}-x86_64.AppImage
          path: release/OpenStacks-${{ env.VERSION }}-x86_64.AppImage
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: github.ref_type == 'tag'
        with:
          name: release-linux
          path: |
            release/OpenStacks-${{ env.VERSION }}-x86_64.AppImage
            release/OpenStacks-${{ env.VERSION }}-x86_64.AppImage.zsync
          if-no-files-found: error
          retention-days: 3

  release:
    if: github.ref_type == 'tag'
    needs: [windows, linux]
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: release-windows
          path: out
      - uses: actions/download-artifact@v4
        with:
          name: release-linux
          path: out
      - name: GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            out/OpenStacks-${{ needs.linux.outputs.version }}-win64.zip
            out/OpenStacks-${{ needs.linux.outputs.version }}-x86_64.AppImage
            out/OpenStacks-${{ needs.linux.outputs.version }}-x86_64.AppImage.zsync
          draft: true
          generate_release_notes: true
